schemaVersion: "2"
kind: sandbox
# Must not collide with a built-in agent name: `sbx` refuses to let a kit
# override the built-in `copilot` agent. The agent name you pass to `sbx run`
# is this `name`, not `copilot`.
name: innsending-copilot
version: "1.0.0"
displayName: GitHub Copilot (innsending)
description: >-
  GitHub Copilot CLI for fyllut/sendinn local development, with the network
  policy our repos need pre-approved.

# Copilot moved from a built-in agent to a public kit in Docker Sandboxes 0.43.
# Use its explicit OCI reference so this remotely loaded kit does not resolve
# the bare name relative to its own source as agents/copilot/spec.yml.
# Extending it inherits the credentials, network policy, entrypoint and agent
# instructions; everything below is layered on top.
extends: "oci://docker.io/sbx/copilot-kit@sha256:bde43a043cd74fd6b02c6aec1c830dbe61a0a22353bc283a96e19fda698a405b"

sandbox:
  # Built from sbx/templates/Dockerfile.sbx-copilot (FROM copilot-docker), which
  # adds mise plus the Cypress runtime libraries. Build it before use:
  #   docker build -f sbx/templates/Dockerfile.sbx-copilot sbx/templates -t innsending-sbx-copilot
  image: "innsending-sbx-copilot:latest"

setup:
  startup:
    - command: ["bash", "-c", "gh extension list | grep -q 'github/gh-stack' || gh extension install github/gh-stack || true"]
    - command: ["bash", "-c", "gh extension upgrade --all"]

permissions:
  network:
    allow:
      # --- Maven / Gradle / JVM builds ---
      - repo1.maven.org
      - archive.apache.org
      - packages.confluent.io
      # Nav's mirror, used as the package/registry proxy for our JVM + npm builds
      - github-package-registry-mirror.gc.nav.no

      # --- mise toolchain manager (installed in the image, resolves runtimes at run time) ---
      - mise.run
      - mise-java.jdx.dev
      - mise.jdx.dev
      - mise-versions.jdx.dev
      - nodejs.org
      - api.adoptium.net
      - download.java.net

      # --- npm ---
      - "**.npmjs.org"
      # Private Nav packages (for example fnrvalidator). Requires NODE_AUTH_TOKEN:
      #   sbx secret set-custom --sandbox <name> --host npm.pkg.github.com \
      #     --env NODE_AUTH_TOKEN --value "$PACKAGE_TOKEN"
      - npm.pkg.github.com

      # --- Nav design system / runtime assets pulled by the frontends / Nais doc ---
      - "**.nav.no"
      - "**.nais.io"

      # --- 3rd party ---
      - "**.cypress.io"
      - eslint.org
      - react.dev
      - nextjs.org
      - junit.org
      - apache.org
      - kotlinlang.org
      - openjdk.org
      - wiremock.org
      - confluent.io
      - postgresql.org
      - typescript-eslint.io
