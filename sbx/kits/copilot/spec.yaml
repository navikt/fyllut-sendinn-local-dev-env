schemaVersion: "2"
kind: sandbox
# Must not collide with a built-in agent name: `sbx` refuses to let a kit
# override the built-in `copilot` agent. The agent name you pass to `sbx run`
# is this `name`, not `copilot`.
name: innsending-copilot
version: "1.0.0"
displayName: GitHub Copilot (innsending)
description: >-
  GitHub Copilot CLI for fyllut/sendinn local development, with the network
  policy our repos need pre-approved.

sandbox:
  # Built from sbx/templates/Dockerfile.sbx-copilot (FROM copilot-docker), which
  # adds mise plus the Cypress runtime libraries. Build it before use:
  #   docker build -f sbx/templates/Dockerfile.sbx-copilot sbx/templates -t innsending-sbx-copilot
  image: "innsending-sbx-copilot:latest"
  entrypoint: [copilot, "--yolo"]

credentials:
  - service: github
    apiKey:
      name: GH_TOKEN
      inject:
        - domain: api.github.com
          header: Authorization
          format: "******"
        - domain: github.com
          header: Authorization
          format: "******"
  - service: copilot
    apiKey:
      name: COPILOT_GITHUB_TOKEN
      inject:
        - domain: api.business.githubcopilot.com
          header: Authorization
          format: "******"
        - domain: api.enterprise.githubcopilot.com
          header: Authorization
          format: "******"
        - domain: api.githubcopilot.com
          header: Authorization
          format: "******"
        - domain: api.individual.githubcopilot.com
          header: Authorization
          format: "******"
        - domain: copilot.github.com
          header: Authorization
          format: "******"

setup:
  install:
    - command: mkdir -p /home/agent/.copilot && chown agent:agent /home/agent/.copilot
      user: "0"
      description: Ensure .copilot is owned by the agent
  startup:
    - command:
        - sh
        - -c
        - |
          set -e
          [ -n "$MCP_GATEWAY_URL" ] || exit 0
          mkdir -p "$HOME/.copilot"
          cat > "$HOME/.copilot/mcp-config.json" <<EOF
          {
            "mcpServers": {
              "mcp-gateway": {
                "type": "http",
                "url": "$MCP_GATEWAY_URL",
                "headers": {
                  "Authorization": "******"
                },
                "tools": ["*"]
              }
            }
          }
          EOF
      user: "agent"
      description: Register the sandbox MCP gateway
    - command: ["bash", "-c", "gh extension list | grep -q 'github/gh-stack' || gh extension install github/gh-stack || true"]
    - command: ["bash", "-c", "gh extension upgrade --all"]
  files:
    - path: /home/agent/.copilot/config.json
      content: '{"trusted_folders": ["${WORKDIR}"]}'
      onlyIfMissing: true
      description: Trust the sandbox workspace

permissions:
  network:
    allow:
      # --- GitHub and Copilot ---
      - api.business.githubcopilot.com
      - api.enterprise.githubcopilot.com
      - api.github.com
      - api.githubcopilot.com
      - api.individual.githubcopilot.com
      - copilot.github.com
      - github.com
      - archive.ubuntu.com
      - security.ubuntu.com
      - ports.ubuntu.com
      - download.docker.com

      # --- Maven / Gradle / JVM builds ---
      - repo1.maven.org
      - archive.apache.org
      - packages.confluent.io
      # Nav's mirror, used as the package/registry proxy for our JVM + npm builds
      - github-package-registry-mirror.gc.nav.no

      # --- mise toolchain manager (installed in the image, resolves runtimes at run time) ---
      - mise.run
      - mise-java.jdx.dev
      - mise.jdx.dev
      - mise-versions.jdx.dev
      - nodejs.org
      - api.adoptium.net
      - download.java.net

      # --- npm ---
      - "**.npmjs.org"
      # Private Nav packages (for example fnrvalidator). Requires NODE_AUTH_TOKEN:
      #   sbx secret set-custom --sandbox <name> --host npm.pkg.github.com \
      #     --env NODE_AUTH_TOKEN --value "$PACKAGE_TOKEN"
      - npm.pkg.github.com

      # --- Nav design system / runtime assets pulled by the frontends / Nais doc ---
      - "**.nav.no"
      - "**.nais.io"

      # --- 3rd party ---
      - "**.cypress.io"
      - eslint.org
      - react.dev
      - nextjs.org
      - junit.org
      - apache.org
      - kotlinlang.org
      - openjdk.org
      - wiremock.org
      - confluent.io
      - postgresql.org
      - typescript-eslint.io

agentInstructions:
  filename: AGENTS.md
